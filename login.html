<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | CareNova</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span> CareNova</a><a class="text-link" href="index.html">← Back to home</a></header>
<main class="auth-layout">
<section class="auth-aside"><p class="eyebrow">WELCOME BACK</p><h1>Your care,<br>all in one place.</h1><p>Sign in to continue your health journey with CareNova.</p><div class="aside-symbol">C<span>+</span></div><small>Human care · Pet care · One account</small></section>
<section class="auth-panel"><p class="eyebrow">PATIENT ACCESS</p><h2>Good to see you.</h2><p class="muted">Enter your permanent Patient ID and password.</p>
<form id="loginForm">
<label>Patient ID<input id="loginId" required placeholder="CN-XXXXXXXX" autocomplete="username"></label>
<label>Password<input id="loginPassword" type="password" required placeholder="Your password" autocomplete="current-password"></label>
<button class="btn btn-dark full" type="submit">Sign in securely ↗</button>
<p id="loginMessage" class="form-message"></p>
</form>
<div class="auth-links"><a href="register.html">New to CareNova? Create account</a><button type="button" class="link-button" id="recoverBtn">Recover Patient ID</button></div>
<div id="recoveryBox" class="recovery-box hidden"><label>Registered email<input id="recoverEmail" type="email" placeholder="you@example.com"></label><button class="btn btn-outline full" id="recoverSubmit" type="button">Find my ID</button><p id="recoveryMessage" class="form-message"></p></div>
</section>
</main>
<script src="js/app.js"></script><script src="js/auth.js"></script>
</body></html>
